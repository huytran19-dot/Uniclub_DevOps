server:
  port: 8080

spring:
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    # Sử dụng service name 'mysql' trong Docker network
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:uniclub}
    username: ${MYSQL_USER:root}
    password: ${db_root_password:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  task:
    scheduling:
      enabled: true

# Actuator configuration for container health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# SendGrid configuration
sendgrid:
  api-key: ${SENDGRID_API_KEY:}

app:
  mail:
    from: ${SENDER_EMAIL:no-reply@uniclub.local}
    otp-expiration-minutes: 5
    max-attempts: 5
  testing:
    enabled: ${TESTING_ENABLED:false}

jwt:
  secret: ${jwt_secret:${JWT_SECRET:}}
  expiration: ${JWT_EXPIRATION:86400000}

r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-key: ${r2_secret_key:${R2_SECRET_KEY:}}
  bucket-name: ${R2_BUCKET_NAME:uniclub-images}
  public-url: ${R2_PUBLIC_URL:https://pub-c85916fa887245a784c22c1c6dd353e8.r2.dev}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${vnpay_hash_secret:${VNPAY_HASH_SECRET:}}
  return-url: ${VNPAY_RETURN_URL:http://localhost/payment/vnpay-return}
  ipn-url: ${VNPAY_IPN_URL:http://localhost/api/vnpay/ipn}

