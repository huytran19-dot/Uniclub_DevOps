server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:uniclub}
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  task:
    scheduling:
      enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 7MB
      max-request-size: 7MB

# Actuator configuration for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Cấu hình email
sendgrid:
  api-key: ${SENDGRID_API_KEY:}

app:
  mail:
    from: ${SENDER_EMAIL:no-reply@uniclub.local}
    otp-expiration-minutes: 5
    max-attempts: 5
  testing:
    enabled: ${TESTING_ENABLED:true}

jwt:
  secret: ${JWT_SECRET:uniclub-dev-jwt-secret-key-min-256-bits-length-for-security}
  expiration: ${JWT_EXPIRATION:86400000}

r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-key: ${R2_SECRET_KEY:}
  bucket-name: ${R2_BUCKET_NAME:uniclub-images}
  public-url: ${R2_PUBLIC_URL:https://pub-c85916fa887245a784c22c1c6dd353e8.r2.dev}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5174/payment/vnpay-return}
