server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:uniclub}
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  task:
    scheduling:
      enabled: true

# Actuator configuration for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Cấu hình email
sendgrid:
  api-key: ${SENDGRID_API_KEY:}

app:
  mail:
    from: ${SENDER_EMAIL:no-reply@uniclub.local}
    otp-expiration-minutes: 5
    max-attempts: 5
  testing:
    enabled: ${TESTING_ENABLED:true}

jwt:
  secret: ${JWT_SECRET:uniclub-dev-jwt-secret-key-min-256-bits-length-for-security}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:}
  api_key: ${CLOUDINARY_API_KEY:}
  api_secret: ${CLOUDINARY_API_SECRET:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5174/payment/vnpay-return}
