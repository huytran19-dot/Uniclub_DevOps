# ==============================================================================
# Uniclub E-Commerce - Main / Production Docker Compose Configuration
# 
# Hướng dẫn sử dụng:
# - Môi trường Dev (chỉ chạy MySQL + phpMyAdmin):
#     docker compose -f docker-compose.dev.yml up -d
# - Môi trường Production (toàn bộ ứng dụng, bảo mật chuẩn doanh nghiệp):
#     docker compose up -d
#     (hoặc: docker compose -f docker-compose.prod.yml up -d)
# ==============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: uniclub-mysql
    restart: always
    secrets:
      - db_root_password
      - db_password
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uniclub}
      MYSQL_USER: ${MYSQL_USER:-uniclub_user}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    # Không expose cổng DB ra ngoài host ở Production để bảo vệ dữ liệu
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - uniclub-network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./uniclub-be
      dockerfile: Dockerfile
    container_name: uniclub-backend
    restart: always
    ports:
      # Chỉ bind localhost 127.0.0.1 để quản trị viên kiểm tra trực tiếp, không mở ra Internet
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    secrets:
      - db_root_password
      - jwt_secret
      - vnpay_hash_secret
      - r2_secret_key
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configtree:/run/secrets/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-uniclub}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=$${db_root_password}
      - JWT_SECRET=$${jwt_secret}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_KEY=$${r2_secret_key}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-uniclub-images}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=$${vnpay_hash_secret}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost/admin/payment/vnpay-return}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - uniclub-network
    deploy:
      resources:
        limits:
          memory: 1200M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./uniclub-fe
      dockerfile: Dockerfile
    container_name: uniclub-frontend
    restart: always
    ports:
      # Cổng công khai duy nhất tiếp nhận HTTP traffic từ người dùng
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - uniclub-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mysql_data:

networks:
  uniclub-network:
    driver: bridge

secrets:
  db_root_password:
    file: ./secret/db_root_password.txt
  db_password:
    file: ./secret/db_password.txt
  jwt_secret:
    file: ./secret/jwt_secret.txt
  vnpay_hash_secret:
    file: ./secret/vnpay_hash_secret.txt
  r2_secret_key:
    file: ./secret/r2_secret_key.txt
