services:
  mysql:
    image: mysql:8.0
    container_name: uniclub-mysql
    restart: always
    secrets:
      - db_root_password
      - db_password
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uniclub}
      MYSQL_USER: ${MYSQL_USER:-uniclub_user}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - uniclub-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional: phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: uniclub-phpmyadmin
    restart: always
    secrets:
      - db_root_password
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD_FILE: /run/secrets/db_root_password
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    depends_on:
      - mysql
    networks:
      - uniclub-network

  # Backend Spring Boot Application
  backend:
    build:
      context: ./uniclub-be
      dockerfile: Dockerfile
    container_name: uniclub-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    secrets:
      - db_root_password
      - jwt_secret
      - cloudinary_api_secret
      - vnpay_hash_secret
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configtree:/run/secrets/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-uniclub}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=$${db_root_password}
      - JWT_SECRET=$${jwt_secret}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=$${cloudinary_api_secret}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=$${vnpay_hash_secret}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost/admin/payment/vnpay-return}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - uniclub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    profiles:
      - production  # Only start in production mode

  # Frontend (Admin + Web)
  frontend:
    build:
      context: ./uniclub-fe
      dockerfile: Dockerfile
    container_name: uniclub-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - uniclub-network
    profiles:
      - production  # Only start in production mode

volumes:
  mysql_data:

networks:
  uniclub-network:
    driver: bridge

secrets:
  db_root_password:
    file: ./secret/db_root_password.txt
  db_password:
    file: ./secret/db_password.txt
  jwt_secret:
    file: ./secret/jwt_secret.txt
  cloudinary_api_secret:
    file: ./secret/cloudinary_api_secret.txt
  vnpay_hash_secret:
    file: ./secret/vnpay_hash_secret.txt
