# ==============================================================================
# Uniclub E-Commerce - Development Environment
# Dành cho lập trình viên chạy mã nguồn Backend & Frontend trực tiếp trên máy host
# Chỉ khởi chạy MySQL và phpMyAdmin trong Docker container
# ==============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: uniclub-mysql-dev
    restart: unless-stopped
    secrets:
      - db_root_password
      - db_password
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uniclub}
      MYSQL_USER: ${MYSQL_USER:-uniclub_user}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    ports:
      # Chỉ bind vào localhost 127.0.0.1 để tránh lộ cổng DB ra mạng nội bộ/LAN
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql-init/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - uniclub-dev-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: uniclub-phpmyadmin-dev
    restart: unless-stopped
    secrets:
      - db_root_password
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD_FILE: /run/secrets/db_root_password
    ports:
      # phpMyAdmin phục vụ lập trình viên quản lý DB trực quan trên localhost
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - uniclub-dev-network

volumes:
  mysql_dev_data:

networks:
  uniclub-dev-network:
    driver: bridge

secrets:
  db_root_password:
    file: ./secret/db_root_password.txt
  db_password:
    file: ./secret/db_password.txt

