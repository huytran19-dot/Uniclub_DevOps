upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Ẩn thông tin phiên bản Nginx trong response headers (chống Fingerprinting)
    server_tokens off;

    # Cho phép upload file tối đa 7MB (đồng bộ giữa Nginx, Spring Boot và R2 Service)
    client_max_body_size 7M;

    # Security headers gia cố bảo mật theo tiêu chuẩn uniclub-security-audit
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Admin Panel - static assets caching
    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Admin Panel - accessible at http://localhost/admin
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    
    # Redirect /admin to /admin/
    location = /admin {
        return 301 /admin/;
    }

    # Web App - static assets caching
    location ^~ /assets/ {
        root /usr/share/nginx/html/web;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Web App - accessible at http://localhost/ or http://localhost/web
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
    }

    location /web {
        alias /usr/share/nginx/html/web;
        try_files $uri $uri/ /web/index.html;
    }

    # Proxy API requests to backend with HTTP/1.1 keepalive
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer and timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml;
}
