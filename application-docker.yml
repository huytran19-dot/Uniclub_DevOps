server:
  port: 8080

spring:
  datasource:
    # Use Docker service name 'mysql' instead of localhost
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:uniclub}
    username: ${MYSQL_USER:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  task:
    scheduling:
      enabled: true

# SendGrid configuration
sendgrid:
  api-key: ${SENDGRID_API_KEY:}

app:
  mail:
    from: ${SENDER_EMAIL:no-reply@uniclub.local}
    otp-expiration-minutes: 5
    max-attempts: 5

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:}
  api_key: ${CLOUDINARY_API_KEY:}
  api_secret: ${CLOUDINARY_API_SECRET:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  return-url: ${VNPAY_RETURN_URL:http://localhost/admin/payment/vnpay-return}
